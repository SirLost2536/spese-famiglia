<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--primary:#3b82f6;--primary-d:#2563eb;--green:#10b981;--red:#ef4444;--orange:#f97316;--purple:#8b5cf6}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;position:sticky;top:0;z-index:100;overflow-x:auto}
.logo{font-weight:700;font-size:17px;padding:14px 0;margin-right:20px;white-space:nowrap;flex-shrink:0}
nav a{padding:14px 10px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;flex-shrink:0}
nav a.active{color:var(--primary);border-bottom-color:var(--primary)}
nav a:hover{color:var(--text)}
main{max-width:960px;margin:0 auto;padding:24px 16px}
.mbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.mbar h2{flex:1;font-size:19px;font-weight:700}
.ico-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0}
.ico-btn:hover{background:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border)}
.card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.card .val{font-size:22px;font-weight:700;line-height:1}
.card .val.r{color:var(--red)}.card .val.g{color:var(--green)}.card .val.b{color:var(--primary)}.card .val.o{color:var(--orange)}
.card .sub{font-size:11px;color:var(--muted);margin-top:5px}
.fcard{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);margin-bottom:20px}
.fcard h3{font-size:15px;font-weight:600;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:11px;font-weight:500;color:var(--muted)}
input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:var(--bg);color:var(--text);outline:none;width:100%}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.btn{padding:9px 18px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-d)}
.btn-g{background:#dcfce7;color:#166534}.btn-g:hover{background:#bbf7d0}
.btn-d{background:#fee2e2;color:var(--red)}.btn-d:hover{background:#fecaca}
.btn-o{background:#fff7ed;color:#c2410c}.btn-o:hover{background:#fed7aa}
.btn-sm{padding:5px 10px;font-size:12px}
.tab-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
.tab.act-s{background:#fee2e2;border-color:#fca5a5;color:var(--red)}
.tab.act-e{background:#dcfce7;border-color:#86efac;color:#166534}
.tab.act-t{background:#ede9fe;border-color:#c4b5fd;color:#7c3aed}
.tab.act-b{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
.elist{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:20px}
.elist-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.elist-h h3{font-size:15px;font-weight:600}
.ei{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.ei:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ei-info{flex:1;min-width:0}
.ei-info .d{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei-info .m{font-size:11px;color:var(--muted);margin-top:1px}
.ei-amt{font-size:15px;font-weight:600;flex-shrink:0}
.ei-amt.r{color:var(--red)}.ei-amt.g{color:var(--green)}.ei-amt.p{color:var(--purple)}
.del-btn,.edit-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:5px;opacity:.5;flex-shrink:0;color:var(--muted)}
.del-btn:hover{opacity:1;color:var(--red)}
.edit-btn:hover{opacity:1;color:var(--primary)}
/* Modal bottom-sheet */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:flex-end;justify-content:center}
.modal-ov.open{display:flex}
.modal-sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
@media(min-width:640px){.modal-sheet{border-radius:16px;margin:auto;margin-bottom:0}}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:13px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:600px){.cgrid{grid-template-columns:1fr}}
.cc{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:18px}
.cc h3{font-size:14px;font-weight:600;margin-bottom:14px}
.congrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.concard{background:var(--card);border-radius:12px;border:2px solid var(--border);padding:18px;cursor:pointer;transition:all .18s}
.concard:hover{border-color:var(--primary);box-shadow:0 4px 16px rgba(59,130,246,.12)}
.concard.cc-sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.concard.cc-dim{opacity:.4}
.concard .tipo{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.concard .nome{font-size:17px;font-weight:700;margin-bottom:12px}
.risp-row{display:flex;gap:6px;margin-top:10px}
.risp-row input{flex:1}
.cat-block{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.cat-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);cursor:pointer}
.cat-head .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-head .cn{flex:1;font-size:13px;font-weight:600}
.cat-head .arr{font-size:11px;color:var(--muted)}
.subcat-list{padding:8px 14px 12px}
.subcat-tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;margin:3px}
.subcat-tag button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:11px;padding:0 2px}
.subcat-tag button:hover{color:var(--red)}
.add-sub{display:flex;gap:6px;margin-top:8px}
.add-sub input{flex:1}
.subcat-detail{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.subcat-detail-h{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.subcat-row{display:flex;align-items:center;padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px}
.subcat-row:last-child{border-bottom:none}
.subcat-row .sname{flex:1;color:var(--text)}
.subcat-row .samt{font-weight:600}
.prev-bar{display:flex;align-items:center;gap:8px;padding:7px 16px;border-bottom:1px solid var(--border);font-size:13px}
.prev-bar:last-of-type{border-bottom:none}
.prev-bar .blbl{width:140px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.prev-bar .track{flex:1;background:var(--bg);border-radius:4px;height:12px;position:relative;overflow:hidden}
.prev-bar .fp{height:12px;border-radius:4px;position:absolute;top:0;left:0;opacity:.4}
.prev-bar .fc{height:12px;border-radius:4px;position:absolute;top:0;left:0}
.prev-bar .amt{width:80px;text-align:right;font-weight:600;font-size:12px;flex-shrink:0}
.prev-bar .diff{width:70px;text-align:right;font-size:11px;flex-shrink:0}
.cmp-row{padding:10px 16px;border-bottom:1px solid var(--border)}
.cmp-row:last-of-type{border-bottom:none}
.cmp-cat{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--text)}
.cmp-split{display:grid;grid-template-columns:1fr 68px 1fr;align-items:center}
.cmp-lside{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.cmp-rside{display:flex;align-items:center;gap:6px}
.cmp-mid{text-align:center;font-size:11px;font-weight:700;padding:2px 2px;line-height:1.3}
.cmp-bref{flex:1;background:var(--bg);border-radius:4px 0 0 4px;height:10px;display:flex;justify-content:flex-end;overflow:hidden}
.cmp-bcur{flex:1;background:var(--bg);border-radius:0 4px 4px 0;height:10px;overflow:hidden}
.cmp-bref span{height:10px;display:block;border-radius:4px 0 0 4px}
.cmp-bcur span{height:10px;display:block;border-radius:0 4px 4px 0}
.cmp-vref{font-size:12px;font-weight:600;color:#64748b;white-space:nowrap;min-width:68px;text-align:right}
.cmp-vcur{font-size:12px;font-weight:600;white-space:nowrap;min-width:68px}
.cmp-hdr{display:grid;grid-template-columns:1fr 68px 1fr;padding:6px 16px;font-size:10px;font-weight:600;color:var(--muted);background:var(--bg);text-transform:uppercase;border-bottom:1px solid var(--border)}
.cmp-hdr-l{text-align:right}.cmp-hdr-c{text-align:center}.cmp-hdr-r{text-align:left;padding-left:6px}
.banner{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:#1d4ed8;display:flex;align-items:center;gap:10px}
.trasf-row{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--border);font-size:13px}
.trasf-row:last-child{border-bottom:none}
#toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999}
#toast.show{opacity:1}
.spin{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;margin-right:6px}
.badge-g{background:#dcfce7;color:#166534}.badge-r{background:#fee2e2;color:#991b1b}
.resc-table{width:100%;border-top:1px solid var(--border)}
.resc-th{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;padding:8px 18px;background:var(--bg);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border)}
.resc-tr{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;padding:9px 18px;border-bottom:1px solid var(--border);font-size:13px}
.resc-tr:last-child{border-bottom:none}

/* ===== BOTTOM NAV (mobile & tablet) ===== */
#bnav{display:none;position:fixed!important;top:auto!important;bottom:0!important;left:0!important;right:0!important;height:auto!important;overflow:visible!important;padding:0!important;padding-bottom:env(safe-area-inset-bottom)!important;z-index:200;background:var(--card);border-top:1px solid var(--border)}
#bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px 10px;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;gap:2px;border:none!important;background:none;-webkit-tap-highlight-color:transparent;position:relative}
#bnav a.active::after{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--primary);border-radius:0 0 2px 2px}
#bnav a .bi{font-size:22px;line-height:1}
#bnav a{border-bottom:none!important}
#bnav a.active{color:var(--primary);border-bottom:none!important}
#bnav a.active .bi{filter:none}

/* ===== RESPONSIVE ===== */
@media(max-width:1024px){
  nav{display:none}
  #bnav{display:flex}
  #toast{bottom:calc(72px + env(safe-area-inset-bottom));right:16px;left:16px;text-align:center}
  main{padding:16px 14px calc(76px + env(safe-area-inset-bottom))}
  /* Inputs a 16px: impedisce lo zoom automatico su iOS */
  input,select,textarea{font-size:16px!important;padding:12px 13px}
  /* Touch targets più grandi */
  .btn{min-height:46px;padding:12px 18px;font-size:14px}
  .btn-sm{min-height:38px;padding:8px 14px;font-size:13px!important}
  .ico-btn{width:40px;height:40px;font-size:16px}
  /* Form a colonna singola su iPhone */
  .fgrid{grid-template-columns:1fr!important}
  /* Card valori più leggibili */
  .card .val{font-size:22px}
  .card .lbl{font-size:12px}
  .card .sub{font-size:12px}
  /* Conti a colonna singola */
  .congrid{grid-template-columns:1fr!important}
  /* Tabs touch-friendly */
  .tab{padding:10px 16px;font-size:14px;min-height:40px}
  /* Liste */
  .ei{padding:14px 16px}
  .elist-h{padding:14px 16px}
  .fcard{padding:18px 16px}
  /* Mbar */
  .mbar h2{font-size:17px}
  /* Confronto butterfly più stretto */
  .cmp-vref,.cmp-vcur{min-width:56px;font-size:11px}
  .cmp-split{grid-template-columns:1fr 56px 1fr}
}
@media(min-width:600px) and (max-width:1024px){
  /* iPad: 2 colonne nei form, 2 colonne nei conti */
  .fgrid{grid-template-columns:repeat(2,1fr)!important}
  .congrid{grid-template-columns:repeat(2,1fr)!important}
  .cards{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

function prevMonth(){let pm=cm-1,py=cy;if(pm<1){pm=12;py--;}return{m:pm,y:py};}

async function load(){
  const prev=prevMonth();
  const [s1,s2,s3,s4,s5,s6,s7,s8,s9]=await Promise.all([
    db.collection('spese').where('mese','==',cm).where('anno','==',cy).get(),
    db.collection('entrate').where('mese','==',cm).where('anno','==',cy).get(),
    db.collection('conti').orderBy('nome').get(),
    db.collection('categorie').orderBy('nome').get(),
    db.collection('categorie_entrate').orderBy('nome').get(),
    db.collection('risparmi').where('mese','==',cm).where('anno','==',cy).get(),
    db.collection('trasferimenti').where('mese','==',cm).where('anno','==',cy).get(),
    db.collection('spese').where('mese','==',prev.m).where('anno','==',prev.y).get(),
    db.collection('entrate').where('mese','==',prev.m).where('anno','==',prev.y).get(),
  ]);
  D.spese=s1.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.data.localeCompare(a.data));
  D.entrate=s2.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.data.localeCompare(a.data));
  D.conti=s3.docs.map(d=>({id:d.id,...d.data()}));
  D.cat=s4.docs.map(d=>({id:d.id,...d.data()}));
  D.catE=s5.docs.map(d=>({id:d.id,...d.data()}));
  D.risp=s6.docs.map(d=>({id:d.id,...d.data()}));
  D.trasf=s7.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.data.localeCompare(a.data));
  Dprev.spese=s8.docs.map(d=>({id:d.id,...d.data()}));
  Dprev.entrate=s9.docs.map(d=>({id:d.id,...d.data()}));
}

async function caricaDatiDefault(){
  if(!confirm('Aggiungerà solo le categorie mancanti (non toccherà quelle che hai già). Continuare?'))return;
  await load();
  const nomiEsistentiS=new Set(D.cat.map(c=>c.nome));
  const nomiEsistentiE=new Set(D.catE.map(c=>c.nome));
  const batch=db.batch();
  let aggiunte=0;
  for(const c of DATI_DEFAULT){
    if(!nomiEsistentiS.has(c.nome)){
      batch.set(db.collection('categorie').doc(),{nome:c.nome,icona:c.icona,colore:c.colore,sottocategorie:c.sottocategorie});
      aggiunte++;
    }
  }
  for(const c of DATI_DEFAULT_ENTRATE){
    if(!nomiEsistentiE.has(c.nome)){
      batch.set(db.collection('categorie_entrate').doc(),{nome:c.nome,icona:c.icona,colore:c.colore,sottocategorie:c.sottocategorie});
      aggiunte++;
    }
  }
  if(aggiunte===0){toast('Nessuna categoria mancante — tutto già presente.');return;}
  await batch.commit();
  toast('Aggiunte '+aggiunte+' categorie mancanti!');await load();go('sett');
}

function go(p){
  page=p;
  document.querySelectorAll('nav a, #bnav a').forEach(a=>a.classList.remove('active'));
  const el=document.getElementById('n-'+p);if(el)el.classList.add('active');
  const bel=document.getElementById('bn-'+p);if(bel)bel.classList.add('active');
  const m=document.getElementById('main');
  if(p==='dash')rDash(m);
  else if(p==='movimenti')rMovimenti(m);
  else if(p==='graf')rGraf(m);
  else if(p==='cont')rCont(m);
  else if(p==='sett')rSett(m);
  else if(p==='resc')rResc(m);
}

function updateSubcat(px,tipo){
  const catId=document.getElementById(px+'-c')?.value;
  const sub=document.getElementById(px+'-s');
  if(!sub)return;
  const arr=tipo==='e'?D.catE:D.cat;
  const c=arr.find(x=>x.id===catId);
  const subs=c?.sottocategorie||[];
  sub.innerHTML='<option value="">— nessuna —</option>'+subs.map(s=>'<option value="'+s+'">'+s+'</option>').join('');
}

async function loadHomeData(){
  const prev=prevMonth();
  const ppM=prev.m===1?12:prev.m-1;
  const ppY=prev.m===1?prev.y-1:prev.y;
  const[sY,eY,rY,rAll,sPP,ePP]=await Promise.all([
    db.collection('spese').where('anno','==',cy).get(),
    db.collection('entrate').where('anno','==',cy).get(),
    db.collection('risparmi').where('anno','==',cy).get(),
    db.collection('risparmi').get(),
    db.collection('spese').where('mese','==',ppM).where('anno','==',ppY).get(),
    db.collection('entrate').where('mese','==',ppM).where('anno','==',ppY).get(),
  ]);
  Dyear.spese=sY.docs.map(d=>({id:d.id,...d.data()}));
  Dyear.entrate=eY.docs.map(d=>({id:d.id,...d.data()}));
  Dyear.risp=rY.docs.map(d=>({id:d.id,...d.data()}));
  window._allRisp=rAll.docs.reduce((s,d)=>s+parseFloat(d.data().importo||0),0);
  DprevPrev.spese=sPP.docs.map(d=>({id:d.id,...d.data()}));
  DprevPrev.entrate=ePP.docs.map(d=>({id:d.id,...d.data()}));
  homeDataLoaded=true;
}

function rGrafDettaglio(el,tipo){
  const voci=tipo==='spese'?D.spese:D.entrate;
  if(voci.length===0){el.innerHTML='<div class="empty" style="background:var(--card);border-radius:12px;border:1px solid var(--border)">Nessun dato questo mese</div>';return}
  const byCat={},colCat={},subByCat={};
  voci.forEach(s=>{
    const n=s.categoriaNome||'Varie';
    byCat[n]=(byCat[n]||0)+parseFloat(s.importo);
    colCat[n]=s.categoriaColore||'#94a3b8';
    if(!subByCat[n])subByCat[n]={};
    const sk=s.sottocategoria||'(nessuna)';
    subByCat[n][sk]=(subByCat[n][sk]||0)+parseFloat(s.importo);
  });
  const labels=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  const vals=labels.map(l=>byCat[l]);
  const cols=labels.map(l=>colCat[l]);
  const tot=vals.reduce((a,b)=>a+b,0);
  const clr=tipo==='spese'?'var(--red)':'var(--green)';
  const bdg=tipo==='spese'?'badge-r':'badge-g';

  el.innerHTML=
  '<div class="cgrid">'+
  '<div class="cc"><h3>'+(tipo==='spese'?'Uscite':'Entrate')+' per categoria</h3><canvas id="cp" height="240"></canvas></div>'+
  '<div class="cc"><h3>Confronto categorie</h3><canvas id="cb" height="240"></canvas></div>'+
  '</div>'+
  '<div class="subcat-detail">'+
  '<div class="subcat-detail-h">Dettaglio per categoria e sottocategoria</div>'+
  labels.map(cat=>{
    const subs=subByCat[cat];
    const catTot=byCat[cat];
    const perc=((catTot/tot)*100).toFixed(0);
    return '<div>'+
      '<div class="subcat-row" style="background:var(--bg);font-weight:600">'+
      '<div class="dot" style="background:'+colCat[cat]+';margin-right:8px;width:11px;height:11px"></div>'+
      '<span class="sname">'+cat+'</span>'+
      '<span class="badge '+bdg+'">'+perc+'%</span>'+
      '<span class="samt" style="color:'+clr+'">'+fmt(catTot)+'</span>'+
      '</div>'+
      Object.entries(subs).sort((a,b)=>b[1]-a[1]).map(([sk,sv])=>
        '<div class="subcat-row"><span class="sname" style="padding-left:22px;color:var(--muted)">↳ '+sk+'</span><span class="samt" style="font-weight:400">'+fmt(sv)+'</span></div>'
      ).join('')+
      '</div>';
  }).join('')+
  '</div>';

  charts.pie=new Chart(document.getElementById('cp'),{
    type:'doughnut',
    data:{labels,datasets:[{data:vals,backgroundColor:cols,borderWidth:2,borderColor:'#fff'}]},
    options:{plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:8}}},cutout:'58%'}
  });
  charts.bar=new Chart(document.getElementById('cb'),{
    type:'bar',
    data:{labels,datasets:[{label:'€',data:vals,backgroundColor:cols,borderRadius:4}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>'€'+v.toLocaleString('it-IT')}}}}
  });
}

async function rGrafConfronto(el){
  const prev=prevMonth();
  const cLabel=MESI[cm]+' '+cy;
  // determine reference period
  let refM,refY;
  if(confMode==='prev'){refM=prev.m;refY=prev.y;}
  else if(confMode==='sameyear'){refM=cm;refY=cy-1;}
  else{refM=confCustomM;refY=confCustomY;}
  const refLabel=MESI[refM]+' '+refY;

  // years available for custom picker (current -2 to current)
  const yearOpts=[cy,cy-1,cy-2].map(y=>'<option value="'+y+'"'+(confCustomY===y?' selected':'')+'>'+y+'</option>').join('');
  const mOpts=MESI.slice(1).map((mn,i)=>'<option value="'+(i+1)+'"'+((i+1)===confCustomM?' selected':'')+'>'+mn+'</option>').join('');

  const btnBase='border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);';
  const btnAct=btnBase+'background:#0071e3;color:#fff;border-color:#0071e3;';
  const btnOff=btnBase+'background:var(--card);color:var(--text);';

  el.innerHTML=
  '<div class="fcard" style="margin-bottom:16px;padding:14px 16px">'+
  '<div style="font-size:13px;font-weight:600;margin-bottom:10px">Confronta <strong>'+cLabel+'</strong> con:</div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'+
  '<button style="'+(confMode==='prev'?btnAct:btnOff)+'" onclick="setConfMode(\'prev\')">◀ Mese precedente</button>'+
  '<button style="'+(confMode==='sameyear'?btnAct:btnOff)+'" onclick="setConfMode(\'sameyear\')">📅 Stesso mese anno scorso</button>'+
  '<button style="'+(confMode==='custom'?btnAct:btnOff)+'" onclick="setConfMode(\'custom\')">🔍 Scegli periodo</button>'+
  '</div>'+
  (confMode==='custom'?
  '<div style="display:flex;gap:8px;align-items:center;margin-top:6px">'+
  '<select id="conf-m" style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text)" onchange="setConfCustom()">'+mOpts+'</select>'+
  '<select id="conf-y" style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text)" onchange="setConfCustom()">'+yearOpts+'</select>'+
  '</div>':'')+
  '</div>'+
  '<div id="conf-body"><div class="spin" style="padding:40px 0;text-align:center">Caricamento…</div></div>';

  // load reference data
  let refS,refE;
  if(confMode==='prev'){
    refS=Dprev.spese;refE=Dprev.entrate;
  } else {
    const [rS,rE]=await Promise.all([
      db.collection('spese').where('mese','==',refM).where('anno','==',refY).get(),
      db.collection('entrate').where('mese','==',refM).where('anno','==',refY).get(),
    ]);
    refS=rS.docs.map(d=>({id:d.id,...d.data()}));
    refE=rE.docs.map(d=>({id:d.id,...d.data()}));
  }

  const bodyEl=document.getElementById('conf-body');
  if(!bodyEl)return;

  function aggr(voci){const m={};voci.forEach(s=>{const n=s.categoriaNome||'Varie';m[n]=(m[n]||0)+parseFloat(s.importo)});return m;}
  const curS=aggr(D.spese),preS=aggr(refS);
  const curE=aggr(D.entrate),preE=aggr(refE);
  const totCS=D.spese.reduce((a,x)=>a+parseFloat(x.importo),0);
  const totPS=refS.reduce((a,x)=>a+parseFloat(x.importo),0);
  const totCE=D.entrate.reduce((a,x)=>a+parseFloat(x.importo),0);
  const totPE=refE.reduce((a,x)=>a+parseFloat(x.importo),0);
  const allCS=[...new Set([...Object.keys(curS),...Object.keys(preS)])].sort((a,b)=>(curS[b]||0)-(curS[a]||0));
  const allCE=[...new Set([...Object.keys(curE),...Object.keys(preE)])].sort((a,b)=>(curE[b]||0)-(curE[a]||0));
  const maxS=Math.max(...[...Object.values(curS),...Object.values(preS)].map(v=>v||0),1);
  const maxE=Math.max(...[...Object.values(curE),...Object.values(preE)].map(v=>v||0),1);
  const diffS=totCS-totPS,diffE=totCE-totPE;

  bodyEl.innerHTML=
  '<div class="fcard" style="margin-bottom:16px">'+
  '<h3 style="margin-bottom:14px">Riepilogo — '+cLabel+' vs '+refLabel+'</h3>'+
  '<div class="cards" style="margin-bottom:0">'+
  '<div class="card"><div class="lbl">Uscite '+cLabel+'</div><div class="val r">'+fmt(totCS)+'</div><div class="sub">vs '+fmt(totPS)+' ('+refLabel+')</div></div>'+
  '<div class="card"><div class="lbl">Entrate '+cLabel+'</div><div class="val g">'+fmt(totCE)+'</div><div class="sub">vs '+fmt(totPE)+' ('+refLabel+')</div></div>'+
  '<div class="card"><div class="lbl">Diff. uscite</div><div class="val '+(diffS<=0?'g':'r')+'">'+(diffS<=0?'−':'+')+''+fmt(Math.abs(diffS))+'</div><div class="sub">'+(diffS<=0?'meno':'più')+' rispetto a '+refLabel+'</div></div>'+
  '<div class="card"><div class="lbl">Diff. entrate</div><div class="val '+(diffE>=0?'g':'r')+'">'+(diffE>=0?'+':'−')+''+fmt(Math.abs(diffE))+'</div><div class="sub">'+(diffE>=0?'più':'meno')+' rispetto a '+refLabel+'</div></div>'+
  '</div></div>';

  function cmpRows(allCats,curMap,refMap,maxVal,curColor){
    return allCats.map(cat=>{
      const c=curMap[cat]||0,p=refMap[cat]||0;
      const wc=maxVal>0?((c/maxVal)*100).toFixed(1):'0';
      const wp=maxVal>0?((p/maxVal)*100).toFixed(1):'0';
      const diff=c-p;
      const diffPos=diff>=0;
      const diffColor=curColor==='#ef4444'?(diffPos?'var(--red)':'var(--green)'):(diffPos?'var(--green)':'var(--red)');
      const diffSign=diff===0?'=':(diffPos?'+':'−');
      return '<div class="cmp-row">'+
        '<div class="cmp-cat">'+cat+'</div>'+
        '<div class="cmp-split">'+
        '<div class="cmp-lside">'+
        '<span class="cmp-vref">'+fmt(p)+'</span>'+
        '<div class="cmp-bref"><span style="width:'+wp+'%;background:#94a3b8"></span></div>'+
        '</div>'+
        '<div class="cmp-mid" style="color:'+diffColor+'">'+diffSign+'<br>'+fmt(Math.abs(diff))+'</div>'+
        '<div class="cmp-rside">'+
        '<div class="cmp-bcur"><span style="width:'+wc+'%;background:'+curColor+'"></span></div>'+
        '<span class="cmp-vcur" style="color:'+curColor+'">'+fmt(c)+'</span>'+
        '</div>'+
        '</div>'+
        '</div>';
    }).join('');
  }

  (allCS.length>0?
  bodyEl.innerHTML+=
  '<div class="subcat-detail" style="margin-bottom:16px">'+
  '<div class="subcat-detail-h">📤 Uscite per categoria</div>'+
  '<div class="cmp-hdr"><div class="cmp-hdr-l">'+refLabel+'</div><div class="cmp-hdr-c">Δ</div><div class="cmp-hdr-r">'+cLabel+'</div></div>'+
  cmpRows(allCS,curS,preS,maxS,'#ef4444')+
  '</div>':null);
  (allCE.length>0?
  bodyEl.innerHTML+=
  '<div class="subcat-detail">'+
  '<div class="subcat-detail-h">📥 Entrate per categoria</div>'+
  '<div class="cmp-hdr"><div class="cmp-hdr-l">'+refLabel+'</div><div class="cmp-hdr-c">Δ</div><div class="cmp-hdr-r">'+cLabel+'</div></div>'+
  cmpRows(allCE,curE,preE,maxE,'#10b981')+
  '</div>':null);
  if(allCS.length===0&&allCE.length===0)bodyEl.innerHTML+='<div class="empty" style="background:var(--card);border-radius:12px;border:1px solid var(--border)">Nessun dato per il confronto</div>';
}

function setConfMode(mode){
  confMode=mode;
  if(mode==='prev'){const p=prevMonth();confCustomM=p.m;confCustomY=p.y;}
  else if(mode==='sameyear'){confCustomM=cm;confCustomY=cy-1;}
  rGrafConfronto(document.getElementById('gb'));
}
function setConfCustom(){
  confCustomM=parseInt(document.getElementById('conf-m').value);
  confCustomY=parseInt(document.getElementById('conf-y').value);
  rGrafConfronto(document.getElementById('gb'));
}

async function loadRispTrend(){
  const rispC=D.conti.filter(c=>c.tipo==='risparmio');
  if(rispC.length===0) return;
  const trendEl=document.getElementById('risp-trend');
  if(!trendEl) return;
  trendEl.innerHTML='<div class="spin">Caricamento…</div>';

  // Carica TUTTI i risparmi
  const snap=await db.collection('risparmi').get();
  const allR=snap.docs.map(d=>({id:d.id,...d.data()}));

  // Salva movimenti per click
  window._rispMovs={};
  rispC.forEach(c=>{
    window._rispMovs[c.id]=allR.filter(r=>r.contoId===c.id).sort((a,b)=>(b.anno*12+b.mese)-(a.anno*12+a.mese));
  });

  // Aggiorna cards con totali
  const palette=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];
  rispC.forEach((c,idx)=>{
    const movs=window._rispMovs[c.id];
    const tot=movs.reduce((s,r)=>s+parseFloat(r.importo),0);
    const last=movs[0];
    const totEl=document.getElementById('cc-tot-'+c.id);
    const lastEl=document.getElementById('cc-last-'+c.id);
    if(totEl) totEl.textContent=fmt(tot);
    if(lastEl) lastEl.textContent=last?'Ultimo: '+fmt(parseFloat(last.importo))+' · '+MESI[last.mese]+' '+last.anno:'Nessun accantonamento';
  });

  if(allR.length===0){
    trendEl.innerHTML='<p style="font-size:13px;color:var(--muted);padding:12px 0">Nessun accantonamento registrato.</p>';
    return;
  }

  // Range mesi: dal primo record fino ad oggi
  const minY=Math.min(...allR.map(r=>r.anno));
  const months=[];
  for(let y=minY;y<=cy;y++){
    for(let mo=1;mo<=12;mo++){
      if(y===cy&&mo>cm) break;
      months.push({y,mo});
    }
  }
  const labels=months.map(({y,mo})=>MESI[mo].substring(0,3)+' '+String(y).slice(2));

  // Dataset cumulativo per ogni conto
  const datasets=rispC.map((c,idx)=>{
    const color=c.colore||palette[idx%palette.length];
    const movs=allR.filter(r=>r.contoId===c.id).sort((a,b)=>(a.anno*12+a.mese)-(b.anno*12+b.mese));
    let cum=0;
    const data=months.map(({y,mo})=>{
      const r=movs.find(r=>r.anno===y&&r.mese===mo);
      if(r) cum+=parseFloat(r.importo);
      return cum>0?cum:null;
    });
    return{label:c.nome,data,borderColor:color,backgroundColor:color+'18',borderWidth:2.5,tension:0.35,pointRadius:3,fill:true,spanGaps:true};
  });

  if(charts.rispTrend){try{charts.rispTrend.destroy()}catch(e){}}
  trendEl.innerHTML='<div style="position:relative;height:260px"><canvas id="rt-chart"></canvas></div>';
  charts.rispTrend=new Chart(document.getElementById('rt-chart'),{
    type:'line',
    data:{labels,datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{font:{size:12},padding:12,usePointStyle:true}}},
      scales:{
        y:{ticks:{callback:v=>'€'+v.toLocaleString('it-IT'),font:{size:11}},beginAtZero:true,grid:{color:'rgba(0,0,0,.05)'}},
        x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45}}
      }
    }
  });
}

function selRispConto(id){
  const rispC=D.conti.filter(c=>c.tipo==='risparmio');

  rispC.forEach(c=>{
    const el=document.getElementById('cc-'+c.id);
    if(!el) return;
    if(c.id===id){el.classList.add('cc-sel');el.classList.remove('cc-dim');}
    else{el.classList.remove('cc-sel');el.classList.add('cc-dim');}

  // Reset se già selezionato

  const conto=rispC.find(c=>c.id===id);

  const idx=rispC.indexOf(conto);
  const color=conto.colore||palette[idx%palette.length];

    '<div style="display:flex;align-items:center;gap:10px">'+
    '<span style="font-size:12px;color:var(--muted)">'+movs.length+' voci · tot. '+fmt(tot)+'</span>'+
    '<button class="btn btn-sm" style="background:var(--bg);border:1px solid var(--border)" onclick="chiudiMovs()">✕ Chiudi</button>'+
    '</div></div>'+
    (movs.length===0
      ?'<p style="font-size:13px;color:var(--muted)">Nessun accantonamento registrato.</p>'
      :'<div class="elist">'+
        movs.map(r=>'<div class="ei">'+
          '<div class="dot" style="background:'+color+'"></div>'+
          '<div class="ei-info"><div class="d">'+MESI[r.mese]+' '+r.anno+'</div></div>'+
          '<div style="text-align:right;flex-shrink:0">'+
          '<div style="font-size:15px;font-weight:700;color:var(--green)">'+fmt(parseFloat(r.importo))+'</div>'+
          '<button class="btn btn-d btn-sm" style="margin-top:4px;font-size:11px;padding:3px 8px" onclick="delRisp(\''+r.id+'\')">Elimina</button>'+
          '</div></div>'
        ).join('')+
      '</div>'
    )+
    '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">'+
    '<button class="btn btn-d btn-sm" onclick="delC(\''+id+'\')">🗑️ Elimina conto</button>'+
    '</div>';
  movsEl.scrollIntoView({behavior:'smooth',block:'start'});
}

function chiudiMovs(){
  const movsEl=document.getElementById('risp-movs');
  if(movsEl) movsEl.style.display='none';

async function fetchPrezziETF(force=false){
  const todayD=new Date();
  const todayStr=cy+'-'+String(cm).padStart(2,'0')+'-'+String(todayD.getDate()).padStart(2,'0');
  let cache={};
  try{cache=JSON.parse(localStorage.getItem('etf_prices_cache')||'{}');}catch(e){}
  if(!force&&cache.date===todayStr&&cache.prices&&Object.keys(cache.prices).length>0) return cache.prices;

  // Prendi tutti i ticker da Firebase
  let tickers=[];
  try{
    const snap=await db.collection('portafoglio').get();
    tickers=[...new Set(snap.docs.map(d=>d.data().ticker).filter(Boolean))];
  }catch(e){return cache.prices||{};}
  if(tickers.length===0) return {};

  const prices={};
  await Promise.all(tickers.map(async ticker=>{
    const p=await fetchSingleETFPrice(ticker);
    if(p!==null) prices[ticker]=p;
  }));

  const now=new Date();
  const updated=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  try{localStorage.setItem('etf_prices_cache',JSON.stringify({date:todayStr,prices,updated}));}catch(e){}
  return prices;
}

async function fetchSingleETFPrice(ticker){
  const base='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(ticker)+'?interval=1d&range=2d';
  const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(base);
  for(const url of [base,proxy]){
    try{
      const res=await fetch(url,{signal:AbortSignal.timeout(9000)});
      if(!res.ok) continue;
      const data=await res.json();
      const meta=data?.chart?.result?.[0]?.meta;
      const price=meta?.regularMarketPrice??meta?.previousClose;
      if(price&&price>0) return parseFloat(price);
    }catch(e){continue;}
  }
  return null;
}

async function addAcquistoETF(){

  const quote=parseFloat(document.getElementById('etf-quote')?.value||0);

  const data=document.getElementById('etf-data')?.value||'';
  if(!ticker){toast('Inserisci il ticker ETF (es. VWCE.DE)');return;}
  if(!quote||quote<=0){toast('Inserisci le quote acquistate');return;}
  if(!speso||speso<=0){toast('Inserisci il totale speso');return;}
  if(!data){toast('Inserisci la data di acquisto');return;}
  const dt=new Date(data);
  await db.collection('portafoglio').add({ticker,nome:nome||ticker,quote,speso,broker,data,anno:dt.getFullYear(),mese:dt.getMonth()+1});

  document.getElementById('em-title').textContent=type==='e'?'✏️ Modifica entrata':'✏️ Modifica uscita';
  document.getElementById('em-data').value=mov.data||'';
  document.getElementById('em-importo').value=mov.importo||'';
  document.getElementById('em-desc').value=mov.descrizione||'';
  // Popola categorie
  const cats=type==='e'?D.catE:D.cat;
  const cs=document.getElementById('em-cat');
  cs.innerHTML=cats.map(c=>'<option value="'+c.id+'" data-nome="'+(c.nome||'')+'" data-colore="'+(c.colore||'')+'" data-icona="'+(c.icona||'')+'">'+(c.icona||'')+' '+c.nome+'</option>').join('');
  if(mov.categoriaId)cs.value=mov.categoriaId;
  emUpdateSub(mov.sottocategoria);
  document.getElementById('edit-modal').classList.add('open');
}
function emUpdateSub(presel){
  const cs=document.getElementById('em-cat');
  const cats=_emType==='e'?D.catE:D.cat;
  const cat=cats.find(c=>c.id===cs.value);
  const subs=cat?.sottocategorie||[];
  const ss=document.getElementById('em-sub');
  ss.innerHTML='<option value="">— nessuna —</option>'+subs.map(s=>'<option value="'+s+'">'+s+'</option>').join('');
  if(presel)ss.value=presel;
}
async function saveEditMov(){
  const data=document.getElementById('em-data').value;
  const importo=parseFloat(document.getElementById('em-importo').value);
  const desc=document.getElementById('em-desc').value.trim();
  if(!data||!importo||importo<=0){toast('Inserisci data e importo');return;}
  const cs=document.getElementById('em-cat');
  const catId=cs.value;
  if(!catId){toast('Seleziona una categoria');return;}
  const catOpt=cs.options[cs.selectedIndex];
  const dt=new Date(data);
  const upd={
    data,importo,
    mese:dt.getMonth()+1,anno:dt.getFullYear(),
    categoriaId:catId,
    categoriaNome:catOpt?.dataset?.nome||'',
    categoriaColore:catOpt?.dataset?.colore||'#94a3b8',
    categoriaIcona:catOpt?.dataset?.icona||'',
    sottocategoria:document.getElementById('em-sub').value,
  };
  if(desc)upd.descrizione=desc;
  const col=_emType==='e'?'entrate':'spese';
  await db.collection(col).doc(_emId).update(upd);
  toast('Salvato!');
  closeEditMov();
  await load();go(page);
}
function closeEditMov(){document.getElementById('edit-modal').classList.remove('open');}
async function delT(id){if(!confirm('Eliminare questo trasferimento?'))return;await db.collection('trasferimenti').doc(id).delete();await load();go(page)}

async function addRispDash(){
  const dv=document.getElementById('r-d').value;
  const imp=parseFloat(document.getElementById('r-i').value);
  const sel=document.getElementById('r-c');
  const contoId=sel?.value;
  const contoNome=sel?.options[sel.selectedIndex]?.dataset?.nome||'';
  if(!dv||!imp||imp<=0){toast('Inserisci data e importo');return}
  if(!contoId){toast('Seleziona un conto deposito');return}
  const dt=new Date(dv);
  const y=dt.getFullYear(),m=dt.getMonth()+1;
  const ex=await db.collection('risparmi').where('contoId','==',contoId).where('anno','==',y).where('mese','==',m).get();
  if(!ex.empty){
    await db.collection('risparmi').doc(ex.docs[0].id).update({importo:imp,data:dv});
    toast('Risparmio aggiornato!');
  } else {
    await db.collection('risparmi').add({data:dv,importo:imp,contoId,contoNome,anno:y,mese:m});
    toast('Risparmio salvato!');
  }
  document.getElementById('r-i').value='';
  await load();go('movimenti');
}

async function chM(d){
  const prevCy=cy;
  cm+=d;if(cm>12){cm=1;cy++}if(cm<1){cm=12;cy--}
  if(cy!==prevCy)homeDataLoaded=false;
  document.getElementById('main').innerHTML='<div class="spin">Caricamento…</div>';
  await load();go(page);

/* RESOCONTO */
function rResc(el){
  const now=new Date();
  const years=[];for(let y=now.getFullYear();y>=now.getFullYear()-5;y--)years.push(y);
  el.innerHTML=
  '<h2 style="margin-bottom:18px;font-size:18px">📊 Resoconto Periodi</h2>'+
  '<div class="fcard" style="margin-bottom:20px">'+
  '<h3 style="margin-bottom:14px">Seleziona periodo</h3>'+
  '<div class="fgrid">'+
  '<div class="fg"><label>Anno</label><select id="r-y">'+years.map(y=>'<option value="'+y+'"'+(y===rescYear?' selected':'')+'>'+y+'</option>').join('')+'</select></div>'+
  '<div class="fg"><label>Da mese</label><select id="r-fm">'+MESI.slice(1).map((m,i)=>'<option value="'+(i+1)+'"'+((i+1)===rescFrom?' selected':'')+'>'+m+'</option>').join('')+'</select></div>'+
  '<div class="fg"><label>A mese</label><select id="r-tm">'+MESI.slice(1).map((m,i)=>'<option value="'+(i+1)+'"'+((i+1)===rescTo?' selected':'')+'>'+m+'</option>').join('')+'</select></div>'+
  '</div>'+
  '<div style="margin-top:12px"><button class="btn btn-p" onclick="loadAndRenderResc()">📥 Carica periodo</button></div>'+
  '</div>'+
  '<div id="resc-body">'+
  (rescLoaded?renderRescBody():'<div class="empty" style="background:var(--card);border-radius:12px;border:1px solid var(--border)">Seleziona un periodo e clicca <b>Carica periodo</b></div>')+
  '</div>';
  if(rescLoaded)renderRescCharts();
}

async function loadAndRenderResc(){
  rescYear=parseInt(document.getElementById('r-y').value);
  rescFrom=parseInt(document.getElementById('r-fm').value);
  rescTo=parseInt(document.getElementById('r-tm').value);
  if(rescFrom>rescTo){toast('Il mese iniziale deve essere ≤ al mese finale');return;}
  document.getElementById('resc-body').innerHTML='<div class="spin">Caricamento…</div>';
  const [s,e]=await Promise.all([
    db.collection('spese').where('anno','==',rescYear).get(),
    db.collection('entrate').where('anno','==',rescYear).get(),
  ]);
  rescData.spese=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.mese>=rescFrom&&x.mese<=rescTo);
  rescData.entrate=e.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.mese>=rescFrom&&x.mese<=rescTo);
  rescLoaded=true;
  document.getElementById('resc-body').innerHTML=renderRescBody();
  renderRescCharts();
}

function renderRescBody(){
  if(!rescLoaded)return'';
  if(rescData.spese.length===0&&rescData.entrate.length===0){
    return'<div class="empty" style="background:var(--card);border-radius:12px;border:1px solid var(--border)">Nessun dato per il periodo selezionato</div>';
  }
  const byM={};
  for(let m=rescFrom;m<=rescTo;m++)byM[m]={spese:0,entrate:0};
  rescData.spese.forEach(x=>{if(byM[x.mese]!==undefined)byM[x.mese].spese+=parseFloat(x.importo)});
  rescData.entrate.forEach(x=>{if(byM[x.mese]!==undefined)byM[x.mese].entrate+=parseFloat(x.importo)});
  const totS=Object.values(byM).reduce((a,v)=>a+v.spese,0);
  const totE=Object.values(byM).reduce((a,v)=>a+v.entrate,0);
  const saldo=totE-totS;
  const pLabel=MESI[rescFrom]+(rescFrom!==rescTo?' — '+MESI[rescTo]:'')+' '+rescYear;
  return'<div class="cards" style="margin-bottom:20px">'+
  '<div class="card"><div class="lbl">Entrate totali</div><div class="val g">'+fmt(totE)+'</div><div class="sub">'+pLabel+'</div></div>'+
  '<div class="card"><div class="lbl">Uscite totali</div><div class="val r">'+fmt(totS)+'</div><div class="sub">'+pLabel+'</div></div>'+
  '<div class="card"><div class="lbl">Saldo periodo</div><div class="val '+(saldo>=0?'g':'r')+'">'+fmt(saldo)+'</div><div class="sub">'+(saldo>=0?'attivo':'passivo')+'</div></div>'+
  '</div>'+
  '<div class="fcard" style="margin-bottom:20px;padding-bottom:20px"><h3 style="margin-bottom:14px">Entrate vs Uscite per mese</h3><canvas id="resc-chart" height="110"></canvas></div>'+
  '<div class="elist" style="margin-bottom:20px">'+
  '<div class="elist-h"><h3>Riepilogo mensile</h3></div>'+
  '<div class="resc-table">'+
  '<div class="resc-th"><span>Mese</span><span style="text-align:right">Entrate</span><span style="text-align:right">Uscite</span><span style="text-align:right">Saldo</span></div>'+
  Object.entries(byM).map(([m,v])=>{
    const sal=v.entrate-v.spese;
    return'<div class="resc-tr">'+
    '<span style="font-weight:500">'+MESI[parseInt(m)]+'</span>'+
    '<span style="text-align:right;color:var(--green)">'+fmt(v.entrate)+'</span>'+
    '<span style="text-align:right;color:var(--red)">'+fmt(v.spese)+'</span>'+
    '<span style="text-align:right;font-weight:600;color:'+(sal>=0?'var(--green)':'var(--red)')+'">'+fmt(sal)+'</span>'+
    '</div>';
  }).join('')+
  '</div></div>';
}

function renderRescCharts(){
  if(charts.resc){try{charts.resc.destroy()}catch(e){}}
  const canvas=document.getElementById('resc-chart');
  if(!canvas)return;
  const byM={};
  for(let m=rescFrom;m<=rescTo;m++)byM[m]={spese:0,entrate:0};
  rescData.spese.forEach(x=>{if(byM[x.mese]!==undefined)byM[x.mese].spese+=parseFloat(x.importo)});
  rescData.entrate.forEach(x=>{if(byM[x.mese]!==undefined)byM[x.mese].entrate+=parseFloat(x.importo)});
  const labels=Object.keys(byM).map(m=>MESI[parseInt(m)]);
  const dataS=Object.values(byM).map(v=>+v.spese.toFixed(2));
  const dataE=Object.values(byM).map(v=>+v.entrate.toFixed(2));
  charts.resc=new Chart(canvas,{
    type:'bar',
    data:{labels,datasets:[
      {label:'Entrate',data:dataE,backgroundColor:'rgba(16,185,129,0.8)',borderRadius:4},
      {label:'Uscite',data:dataS,backgroundColor:'rgba(239,68,68,0.8)',borderRadius:4}
    ]},
    options:{plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},scales:{y:{ticks:{callback:v=>'€'+v.toLocaleString('it-IT')},beginAtZero:true}}}
  });
}

function fmt(v){return'€ '+parseFloat(v||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fdate(d){return new Date(d+'T00:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})}
function today(){return new Date().toISOString().split('T')[0]}
function escHTML(s){return s.replace(/'/g,"\\'")}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

load().then(()=>go('dash')).catch(e=>{
  document.getElementById('main').innerHTML='<div class="empty" style="background:var(--card);border-radius:12px;border:1px solid var(--border);margin-top:20px">Errore: '+e.message+'</div>';
});
</script>
